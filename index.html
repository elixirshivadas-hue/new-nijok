<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NIJØK Books — Premium Web App</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            nijokBg: '#FAF8F0',
            nijokGreen: '#195C40',
            nijokNavy: '#152D3B',
          }
        }
      }
    }
  </script>
  
  <!-- React & Lucide CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide-react@0.263.1/dist/umd/lucide-react.min.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  
  <style>
    body { background-color: #FAF8F0; color: #152D3B; font-family: 'Inter', sans-serif; }
    .font-serif { font-family: 'Playfair Display', serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-[#FAF8F0] antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;
    const { Scan, Search, BookOpen, Star, MessageSquare, Users, StickyNote, ChevronRight, Home, Compass, MessageCircle, Bell, X, Heart } = lucideReact;

    const VISUALS = {
      hero: "https://images.unsplash.com/photo-1512820790803-83ca734da794?auto=format&fit=crop&w=1000&q=80",
      scan: "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=600&q=80",
      search: "https://images.unsplash.com/photo-1497633762265-9d179a990aa6?auto=format&fit=crop&w=600&q=80",
      library: "https://images.unsplash.com/photo-1507842217343-583bb7270b66?auto=format&fit=crop&w=600&q=80",
      reviews: "https://images.unsplash.com/photo-1516979187457-637abb4f9353?auto=format&fit=crop&w=600&q=80",
      discussions: "https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=600&q=80",
      community: "https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&fit=crop&w=600&q=80"
    };

    const TRENDING_BOOKS = [
      { id: "9780735211292", title: "Atomic Habits", author: "James Clear", rating: 4.8, cover: "https://covers.openlibrary.org/b/id/12843865-L.jpg", desc: "An Easy & Proven Way to Build Good Habits & Break Bad Ones." },
      { id: "9780143130727", title: "Ikigai", author: "Héctor García", rating: 4.6, cover: "https://covers.openlibrary.org/b/id/10522079-L.jpg", desc: "The Japanese Secret to a Long and Happy Life." },
      { id: "9780062316097", title: "Sapiens", author: "Yuval Noah Harari", rating: 4.7, cover: "https://covers.openlibrary.org/b/id/12547148-L.jpg", desc: "A Brief History of Humankind." },
      { id: "9780857197689", title: "Psychology of Money", author: "Morgan Housel", rating: 4.7, cover: "https://covers.openlibrary.org/b/id/10543216-L.jpg", desc: "Timeless lessons on wealth, greed, and happiness." }
    ];

    function App() {
      const [selectedBook, setSelectedBook] = useState(null);
      const [loading, setLoading] = useState(false);

      const scanMultiSource = async (isbn) => {
        setLoading(true);
        try {
          const res = await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`);
          const data = await res.json();
          const key = `ISBN:${isbn}`;
          if (data[key]) {
            const b = data[key];
            setSelectedBook({
              title: b.title,
              author: b.authors ? b.authors[0].name : "Author",
              cover: b.cover ? b.cover.large : VISUALS.hero,
              isbn: isbn,
              desc: b.notes || "Live Open Library Book Details"
            });
          } else {
            setSelectedBook(TRENDING_BOOKS[0]);
          }
        } catch(e) {
          setSelectedBook(TRENDING_BOOKS[0]);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen pb-24 max-w-md mx-auto">
          <!-- Header -->
          <header className="sticky top-0 z-40 bg-[#FAF8F0]/90 backdrop-blur-md px-4 py-3 border-b border-[#152D3B]/10 flex items-center justify-between">
            <div className="flex items-center space-x-2">
              <div className="w-8 h-8 rounded-full bg-[#195C40] text-white font-serif font-bold flex items-center justify-center">N</div>
              <div>
                <span className="font-serif text-2xl font-bold text-[#195C40] tracking-tight">NIJØK</span>
                <span className="text-[10px] tracking-widest block text-[#152D3B]/60 uppercase font-semibold -mt-1">Books</span>
              </div>
            </div>
            <div className="flex space-x-2">
              <div className="p-2 bg-white rounded-full border border-gray-200"><Search className="w-4 h-4" /></div>
              <div className="p-2 bg-white rounded-full border border-gray-200"><Bell className="w-4 h-4" /></div>
            </div>
          </header>

          <main className="p-4 space-y-4">
            <!-- Hero -->
            <div className="relative rounded-3xl overflow-hidden h-48 p-4 flex flex-col justify-end text-white shadow-md">
              <img src={VISUALS.hero} className="absolute inset-0 w-full h-full object-cover brightness-75" />
              <div className="relative z-10">
                <span className="text-[10px] bg-white/20 px-2.5 py-0.5 rounded-full backdrop-blur-md">Good Books • Better Days ♡</span>
                <h1 className="font-serif text-2xl font-bold">Discover Books</h1>
                <p className="text-xs text-amber-100">Scan • Explore • Review • Discuss</p>
              </div>
            </div>

            <!-- Feature Cards -->
            <div className="grid grid-cols-2 gap-3">
              <div onClick={() => scanMultiSource("9780735211292")} className="bg-[#E8F5E9] p-3.5 rounded-2xl relative overflow-hidden h-28 flex flex-col justify-between cursor-pointer border border-emerald-200">
                <img src={VISUALS.scan} className="absolute right-0 top-0 w-1/2 h-full object-cover opacity-20 mix-blend-multiply" />
                <div className="w-7 h-7 rounded-full bg-[#195C40] text-white flex items-center justify-center"><Scan className="w-3.5 h-3.5" /></div>
                <div>
                  <h3 className="font-bold text-xs flex justify-between items-center">Scan Barcode <ChevronRight className="w-3 h-3 text-[#195C40]" /></h3>
                  <p className="text-[9px] text-gray-600">Multi-source ISBN lookup</p>
                </div>
              </div>

              <div className="bg-[#E3F2FD] p-3.5 rounded-2xl relative overflow-hidden h-28 flex flex-col justify-between border border-blue-200">
                <img src={VISUALS.search} className="absolute right-0 top-0 w-1/2 h-full object-cover opacity-20 mix-blend-multiply" />
                <div className="w-7 h-7 rounded-full bg-blue-600 text-white flex items-center justify-center"><Search className="w-3.5 h-3.5" /></div>
                <div>
                  <h3 className="font-bold text-xs flex justify-between items-center">Search Books <ChevronRight className="w-3 h-3 text-blue-600" /></h3>
                  <p className="text-[9px] text-gray-600">Title, author, topic</p>
                </div>
              </div>

              <div className="bg-[#E8F5E9]/60 p-3.5 rounded-2xl relative overflow-hidden h-28 flex flex-col justify-between border border-emerald-100">
                <img src={VISUALS.library} className="absolute right-0 top-0 w-1/2 h-full object-cover opacity-25 mix-blend-multiply" />
                <div className="w-7 h-7 rounded-full bg-[#195C40] text-white flex items-center justify-center"><BookOpen className="w-3.5 h-3.5" /></div>
                <div>
                  <h3 className="font-bold text-xs">My Library</h3>
                  <p className="text-[9px] text-gray-600">Reading list & saved</p>
                </div>
              </div>

              <div className="bg-[#FFF3E0] p-3.5 rounded-2xl relative overflow-hidden h-28 flex flex-col justify-between border border-amber-200">
                <img src={VISUALS.reviews} className="absolute right-0 top-0 w-1/2 h-full object-cover opacity-25 mix-blend-multiply" />
                <div className="w-7 h-7 rounded-full bg-amber-600 text-white flex items-center justify-center"><Star className="w-3.5 h-3.5 fill-white" /></div>
                <div>
                  <h3 className="font-bold text-xs">Reviews</h3>
                  <p className="text-[9px] text-gray-600">Share your thoughts</p>
                </div>
              </div>
            </div>

            <!-- Trending -->
            <div className="space-y-2 pt-2">
              <h2 className="font-serif text-base font-bold">Trending Books</h2>
              <div className="flex space-x-3 overflow-x-auto no-scrollbar pb-2">
                {TRENDING_BOOKS.map(b => (
                  <div key={b.id} onClick={() => setSelectedBook(b)} className="w-32 shrink-0 bg-white p-2 rounded-xl border border-gray-200 shadow-sm cursor-pointer">
                    <img src={b.cover} className="w-full h-36 object-cover rounded-lg mb-1.5" />
                    <h4 className="font-bold text-xs truncate">{b.title}</h4>
                    <p className="text-[10px] text-gray-500 truncate">{b.author}</p>
                  </div>
                ))}
              </div>
            </div>
          </main>

          <!-- Bottom Nav -->
          <nav className="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t px-4 py-2 flex justify-around max-w-md mx-auto z-40">
            <button className="text-[#195C40] flex flex-col items-center"><Home className="w-5 h-5" /><span className="text-[10px]">Home</span></button>
            <button className="text-gray-400 flex flex-col items-center"><Compass className="w-5 h-5" /><span className="text-[10px]">Explore</span></button>
            <button className="flex flex-col items-center -mt-5">
              <div className="w-11 h-11 rounded-full bg-[#195C40] text-white flex items-center justify-center shadow-md border-4 border-[#FAF8F0]"><BookOpen className="w-5 h-5" /></div>
              <span className="text-[10px] font-bold text-[#195C40]">Books</span>
            </button>
            <button className="text-gray-400 flex flex-col items-center"><MessageCircle className="w-5 h-5" /><span className="text-[10px]">Chats</span></button>
            <button className="text-gray-400 flex flex-col items-center"><StickyNote className="w-5 h-5" /><span className="text-[10px]">Notes</span></button>
          </nav>

          <!-- Modal -->
          {selectedBook && (
            <div className="fixed inset-0 bg-black/60 z-50 flex items-end justify-center">
              <div className="bg-[#FAF8F0] w-full max-w-md p-5 rounded-t-3xl space-y-3">
                <div className="flex justify-between items-center border-b pb-2">
                  <span className="text-xs font-bold text-[#195C40]">Book Detail</span>
                  <button onClick={() => setSelectedBook(null)} className="p-1 rounded-full bg-gray-200"><X className="w-4 h-4" /></button>
                </div>
                <div className="flex space-x-3">
                  <img src={selectedBook.cover} className="w-20 h-28 object-cover rounded-lg shadow" />
                  <div>
                    <h3 className="font-bold text-sm">{selectedBook.title}</h3>
                    <p className="text-xs text-gray-600">{selectedBook.author}</p>
                    <p className="text-[10px] text-gray-400 mt-2">ISBN: {selectedBook.isbn}</p>
                  </div>
                </div>
                <p className="text-xs bg-white p-3 rounded-xl border">{selectedBook.desc}</p>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
